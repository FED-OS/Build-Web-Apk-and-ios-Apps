# Project-wide Gradle settings.

# JVM arguments for the daemon process.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Performance: parallel builds, configuration & build caching, daemon.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.daemon=true

# Kotlin/KGP settings (used by AGP / Capacitor).
kotlin.code.style=official

# AndroidX.
android.useAndroidX=true

# Non-transitive R classes for faster, leaner builds.
android.nonTransitiveRClass=true

# Suppress unsupported compiler warnings from 3rd-party plugins.
android.suppressUnsupportedCompileSdk=36
